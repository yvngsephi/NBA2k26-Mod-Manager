<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA 2K26 Court Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-section">
      <h1 class="brand-title">NBA 2K26 Court Editor</h1>
    </div>
    <div class="header-right">
      <div id="gameStatusPill" class="status-pill status-standby">
        <span class="status-dot"></span>
        <span id="gameStatusText">Offline</span>
      </div>
      <button id="refreshStatusBtn" class="btn btn-ghost" title="Check Connection">Refresh</button>
      <button id="syncRosterBtn" class="btn btn-sync" title="Sync Roster from NBA 2K26">
        <svg class="sync-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Sync Roster
      </button>
    </div>
  </header>

  <!-- Workspace Container -->
  <div class="app-workspace">
    <!-- Left Sidebar: Teams Navigation -->
    <aside class="sidebar-teams">
      <div class="sidebar-header">
        <input type="text" id="teamSearchInput" class="input-filter" placeholder="Search teams...">
        <div class="team-category-tabs" id="teamCategoryTabs">
          <button class="team-tab-btn active" data-cat="all">All</button>
          <button class="team-tab-btn" data-cat="nba_current">NBA</button>
          <button class="team-tab-btn" data-cat="classic">Classic</button>
          <button class="team-tab-btn" data-cat="street">Street</button>
        </div>
      </div>
      <div class="team-list" id="teamList">
        <!-- Rendered via app.js -->
      </div>
    </aside>

    <!-- Main Content Area: Editor Workspace -->
    <main class="editor-main">
      <!-- Active Team Banner -->
      <section class="active-team-card">
        <div class="team-identity">
          <span id="teamBadge" class="team-abbr-badge">MIA</span>
          <div class="team-details">
            <h2 id="teamHeading" class="team-heading">Miami Heat</h2>
            <div class="team-assignment-meta">
              <span>Default: <strong id="teamDefaultArena">Kaseya Center</strong></span>
              <span id="teamDefaultFloorWrapper" style="display:none;"><strong id="teamDefaultFloor">Floor</strong></span>
            </div>
          </div>
        </div>
        <div class="active-state-box">
          <div class="state-label">Assigned</div>
          <div id="activeConfigSummary" class="state-value">Default</div>
        </div>
      </section>

      <!-- Selection Mode Tabs -->
      <nav class="editor-tabs">
        <button class="editor-tab active" data-pane="arenasPane">Courts</button>
        <button class="editor-tab" data-pane="floorsPane">Floors</button>
      </nav>

      <!-- Pane 1: Arena / Court Picker -->
      <section id="arenasPane" class="tab-pane active">
        <div class="pane-toolbar">
          <div class="category-tabs" id="arenaCategoryTabs">
            <button class="tab-btn active" data-category="all">All</button>
            <button class="tab-btn" data-category="nba">NBA 5v5</button>
            <button class="tab-btn" data-category="hs">High School</button>
            <button class="tab-btn" data-category="street">Street</button>
            <button class="tab-btn" data-category="arcade">Arcade</button>
            <button class="tab-btn" data-category="classic">Classic</button>
            <button class="tab-btn" data-category="mods">Mods</button>
          </div>
          <input type="text" id="arenaSearchInput" class="input-search" placeholder="Search courts...">
        </div>
        <div class="court-grid" id="arenaGrid">
          <!-- Rendered via app.js -->
        </div>
      </section>

      <!-- Pane 2: Floor Pattern Picker -->
      <section id="floorsPane" class="tab-pane">
        <div class="pane-toolbar">
          <div class="floor-sync-toggle">
            <label class="checkbox-label">
              <input type="checkbox" id="syncFloorCheckbox" checked>
              <span>Auto-match floor to court</span>
            </label>
          </div>
          <input type="text" id="floorSearchInput" class="input-search" placeholder="Search floors...">
        </div>
        <div class="floor-grid" id="floorGrid">
          <!-- Rendered via app.js -->
        </div>
      </section>
    </main>
  </div>

  <!-- Bottom Action Dock -->
  <footer class="action-dock">
    <div class="dock-summary">
      <div class="dock-col">
        <span class="dock-label">Target</span>
        <span id="dockTargetTeam" class="dock-value">Miami Heat</span>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-col">
        <span class="dock-label">Selected Court</span>
        <span id="dockSelectedArena" class="dock-value">None</span>
      </div>
      <div class="dock-col">
        <span class="dock-label">Format</span>
        <span id="dockCourtScale" class="dock-value">NBA 94ft</span>
      </div>
      <div class="dock-divider"></div>
      <div class="dock-col">
        <span class="dock-label">Floor</span>
        <span id="dockSelectedFloor" class="dock-value">Auto</span>
      </div>
    </div>

    <!-- Hidden compatibility elements to maintain JS bindings -->
    <div id="dockRulesetContainer" style="display:none;">
      <input type="checkbox" id="forceRulesetCheckbox">
      <span id="rulesetStatusLabel"></span>
      <span id="rulesetHintText"></span>
    </div>

    <div class="dock-actions">
      <button id="resetBtn" class="btn btn-secondary">Reset</button>
      <button id="applyBtn" class="btn btn-primary" disabled>Apply Court</button>
    </div>
  </footer>

  <!-- Realtime Diagnostic Status Line -->
  <div class="diagnostic-bar">
    <span id="diagnosticMsg" class="diag-text">Ready.</span>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
